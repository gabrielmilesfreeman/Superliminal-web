<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>superliminal // fragrance</title>
    <style>
        /* CSS Reset & Typographic Foundations */
        * { box-sizing: border-box; }
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 11px;
            font-weight: normal;
            margin: 0;
            padding: 2vw;
            text-transform: lowercase;
        }
        
        /* Grid Layout */
        .wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            min-height: calc(100vh - 4vw);
            border: 1px solid #000;
        }
        
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1vw;
            border-bottom: 1px solid #000;
        }
        
        h1 {
            font-size: 11px;
            font-weight: normal;
            margin: 0;
        }
        
        .cart-status {
            cursor: pointer;
        }
        
        .product {
            border-right: 1px solid #000;
            padding: 1vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .product:last-child {
            border-right: none;
        }
        
        .product-title {
            font-size: 11px;
            font-weight: normal;
            margin: 0;
        }
        
        button.add-to-cart {
            width: 100%;
            background: none;
            color: #000000;
            border: 1px solid #000000;
            padding: 0.5rem;
            font-family: inherit;
            font-size: 11px;
            text-transform: lowercase;
            cursor: pointer;
            text-align: left;
        }
        
        button.add-to-cart:hover {
            background: #000000;
            color: #ffffff;
        }

        /* Cart UI */
        #cart-panel {
            display: none;
            position: fixed;
            top: 2vw; right: 2vw; bottom: 2vw;
            width: 96vw; max-width: 300px;
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            padding: 1vw;
            z-index: 100;
        }
        #cart-panel.active { display: block; }
        .close-cart { cursor: pointer; display: block; margin-bottom: 2rem; }

        /* Mobile adaptation */
        @media (max-width: 768px) {
            .wrapper { grid-template-columns: 1fr; }
            header { grid-row: 1; grid-column: 1; }
            .product { border-right: none; border-bottom: 1px solid #000; }
            .product:last-child { border-bottom: none; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>superliminal</h1>
            <div class="cart-status" onclick="toggleCart()">cart [ <span id="cart-count">0</span> ]</div>
        </header>

        <div class="product">
            <h2 class="product-title">oyster</h2>
            <button class="add-to-cart" onclick="addToCart('oyster')">add to cart</button>
        </div>

        <div class="product">
            <h2 class="product-title">hole</h2>
            <button class="add-to-cart" onclick="addToCart('hole')">add to cart</button>
        </div>

        <div class="product">
            <h2 class="product-title">book</h2>
            <button class="add-to-cart" onclick="addToCart('book')">add to cart</button>
        </div>
    </div>

    <!-- Hidden Cart Panel -->
    <div id="cart-panel">
        <span class="close-cart" onclick="toggleCart()">[x] close</span>
        <div id="cart-items"></div>
        <button style="width: 100%; border: 1px solid #000000; background: none; color: #000000; padding: 0.5rem; margin-top: 2rem; font-family: inherit; font-size: 11px; text-transform: lowercase; text-align: left; cursor: pointer;" onclick="checkout()">checkout</button>
    </div>

    <script>
        let cartCount = 0;
        
        function addToCart(name) {
            cartCount++;
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cartCount;
        }

        function toggleCart() {
            document.getElementById('cart-panel').classList.toggle('active');
        }

        function checkout() {
            alert("checkout functionality requires a payment gateway integration.");
        }
    </script>
</body>
</html>
