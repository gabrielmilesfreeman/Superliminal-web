<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERLIMINAL // FRAGRANCE</title>
    <style>
        /* CSS Reset & Utilitarian Foundations */
        * { box-sizing: border-box; }
        body {
            background-color: #f0f0f0; /* Off-white / concrete */
            color: #000;
            font-family: "Courier New", Courier, monospace; /* Monospaced for industrial feel */
            margin: 0;
            padding: 0;
            text-transform: uppercase;
        }
        
        /* Grid Layout */
        .wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            min-height: 100vh;
            border: 2px solid #000; /* Exposed structure */
        }
        
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 2vw;
            border-bottom: 2px solid #000;
        }
        
        h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            margin: 0;
            letter-spacing: -0.1vw;
            font-weight: 900;
        }
        
        .cart-status {
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
        }
        
        .product {
            border-right: 2px solid #000;
            padding: 4vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }
        
        .product:last-child {
            border-right: none;
        }
        
        .product-title {
            font-size: clamp(3rem, 10vw, 8rem);
            margin: 0;
            line-height: 1;
            letter-spacing: -0.2vw;
            font-weight: 900;
        }
        
        button.add-to-cart {
            width: 100%;
            background: none;
            color: #000;
            border: 2px solid #000;
            padding: 1rem;
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        button.add-to-cart:hover {
            background: #000;
            color: #f0f0f0;
        }

        /* Cart UI (Minimal overlay) */
        #cart-panel {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 96vw; max-width: 400px;
            background: #000; color: #f0f0f0;
            border-left: 2px solid #f0f0f0;
            padding: 2rem;
            z-index: 100;
        }
        #cart-panel.active { display: block; }
        .close-cart { cursor: pointer; text-decoration: underline; display: block; margin-bottom: 2rem;}

        /* Mobile adaptation (Stack columns) */
        @media (max-width: 768px) {
            .wrapper { grid-template-columns: 1fr; }
            header { grid-row: 1; grid-column: 1; }
            .product { border-right: none; border-bottom: 2px solid #000; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>SUPERLIMINAL</h1>
            <div class="cart-status" onclick="toggleCart()">CART [ <span id="cart-count">0</span> ]</div>
        </header>

        <div class="product">
            <h2 class="product-title">OYSTER</h2>
            <button class="add-to-cart" onclick="addToCart('OYSTER')">ADD TO CART</button>
        </div>

        <div class="product">
            <h2 class="product-title">HOLE</h2>
            <button class="add-to-cart" onclick="addToCart('HOLE')">ADD TO CART</button>
        </div>

        <div class="product">
            <h2 class="product-title">BOOK</h2>
            <button class="add-to-cart" onclick="addToCart('BOOK')">ADD TO CART</button>
        </div>
    </div>

    <!-- Minimal Cart Panel -->
    <div id="cart-panel">
        <span class="close-cart" onclick="toggleCart()">[X] CLOSE CART</span>
        <h3>ORDER SUMMARY</h3>
        <div id="cart-items"></div>
        <button style="width: 100%; border: 2px solid #f0f0f0; background: none; color: #f0f0f0; padding: 1rem; margin-top: 2rem;" onclick="checkout()">CHECKOUT</button>
    </div>

    <script>
        let cartCount = 0;
        
        function addToCart(name) {
            cartCount++;
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cartCount;
        }

        function toggleCart() {
            document.getElementById('cart-panel').classList.toggle('active');
        }

        function checkout() {
            alert("A static file cannot process real payments. You must integrate a live payment service.");
        }
    </script>
</body>
</html>
